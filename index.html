<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to Love First Church</title>
    <!-- Importing modern Outfit font -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        /* Specific Home Page Styles */
        .hero-container {
            text-align: center;
            z-index: 10;
            max-width: 800px;
            padding: 40px;
        }

        .hero-logo {
            max-width: 350px;
            margin-bottom: 20px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            animation: fadeInDown 1s ease-out;
        }

        .hero-title {
            font-size: 3.5rem;
            font-weight: 700;
            margin-bottom: 20px;
            color: #fff;
            text-shadow: 0 5px 15px rgba(0,0,0,0.5);
            animation: fadeInUp 1s ease-out 0.2s both;
        }

        .hero-subtitle {
            font-size: 1.3rem;
            color: rgba(255, 255, 255, 0.85);
            margin-bottom: 40px;
            line-height: 1.6;
            animation: fadeInUp 1s ease-out 0.4s both;
        }

        .hero-actions {
            display: flex;
            gap: 20px;
            justify-content: center;
            animation: fadeInUp 1s ease-out 0.6s both;
        }

        .btn-primary {
            display: inline-block;
            padding: 16px 40px;
            border-radius: 50px;
            background: linear-gradient(90deg, var(--color-magenta), var(--color-orange));
            color: white;
            font-size: 1.15rem;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 10px 20px rgba(226, 28, 97, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 30px rgba(226, 28, 97, 0.5);
        }

        .btn-secondary {
            display: inline-block;
            padding: 16px 40px;
            border-radius: 50px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            font-size: 1.15rem;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-3px);
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 600px) {
            .hero-actions {
                flex-direction: column;
            }
            .hero-title {
                font-size: 2.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="background-container">
        <!-- Floating orbs for gradient effects -->
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>

    <main class="hero-container">
        <img src="logo.jpg" alt="Love First Church" class="hero-logo">
        <h1 class="hero-title">Welcome Home</h1>
        <p class="hero-subtitle">Experience God's love, grow in faith, and connect with a family that puts love first. We invite you to join our growing community.</p>
        
        <div class="hero-actions">
            <a href="membership.html" class="btn-primary">Become a Member</a>
            <a href="admin.html" class="btn-secondary">Admin Dashboard</a>
        </div>
    </main>
</body>
</html>
